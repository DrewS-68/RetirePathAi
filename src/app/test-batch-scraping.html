<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Batch Scraping</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-top: 0;
        }
        .section {
            margin: 30px 0;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
            border-left: 4px solid #4CAF50;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 300px;
            margin: 5px;
        }
        pre {
            background: #282c34;
            color: #abb2bf;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
        }
        .status {
            padding: 10px;
            border-radius: 6px;
            margin: 10px 0;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Batch Scraping Test Tool</h1>
        
        <div class="section">
            <h2>Step 1: Login</h2>
            <p>Enter your admin credentials to get an auth token:</p>
            <input type="email" id="email" placeholder="Email" value="">
            <input type="password" id="password" placeholder="Password" value="">
            <br>
            <button onclick="login()">Login</button>
            <div id="loginStatus"></div>
        </div>

        <div class="section">
            <h2>Step 2: Start Batch Scraping</h2>
            <p>Villages to scrape: <input type="number" id="batchSize" value="10" style="width: 100px;"></p>
            <button onclick="startBatch()" id="startBtn" disabled>Start Batch</button>
            <button onclick="checkStatus()">Check Status</button>
            <button onclick="resetBatch()">Reset Batch</button>
            <div id="batchStatus"></div>
        </div>

        <div class="section">
            <h2>Console Log</h2>
            <pre id="console"></pre>
        </div>
    </div>

    <script type="module">
        const SUPABASE_URL = 'https://luwfbkxjbogfapgkznve.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1d2Zia3hqYm9nZmFwZ2t6bnZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzcyNDE5OTcsImV4cCI6MjA1MjgxNzk5N30.5Z3rgV9t_0vI66MZE7HQZI8ViDE3gd_JDUiI6-4Ongk';
        
        let accessToken = null;

        function log(message) {
            const console = document.getElementById('console');
            const timestamp = new Date().toLocaleTimeString();
            console.textContent += `[${timestamp}] ${message}\n`;
            console.scrollTop = console.scrollHeight;
        }

        window.login = async function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                document.getElementById('loginStatus').innerHTML = '<div class="status error">Please enter email and password</div>';
                return;
            }

            log('Attempting login...');
            
            try {
                // Use Supabase auth endpoint
                const response = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_ANON_KEY
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();
                
                if (response.ok && data.access_token) {
                    accessToken = data.access_token;
                    log(`✅ Login successful! Token: ${accessToken.substring(0, 20)}...`);
                    document.getElementById('loginStatus').innerHTML = '<div class="status success">✅ Logged in successfully!</div>';
                    document.getElementById('startBtn').disabled = false;
                } else {
                    log(`❌ Login failed: ${JSON.stringify(data)}`);
                    document.getElementById('loginStatus').innerHTML = `<div class="status error">❌ Login failed: ${data.error_description || data.error || 'Unknown error'}</div>`;
                }
            } catch (error) {
                log(`❌ Login error: ${error.message}`);
                document.getElementById('loginStatus').innerHTML = `<div class="status error">❌ Error: ${error.message}</div>`;
            }
        };

        window.startBatch = async function() {
            if (!accessToken) {
                alert('Please login first!');
                return;
            }

            const batchSize = parseInt(document.getElementById('batchSize').value) || 10;
            
            log(`Starting batch scraping with ${batchSize} villages...`);
            
            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/make-server-3bba8be8/batch-scraping/start`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        batchSize: batchSize,
                        delayBetweenRequests: 2000
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    log(`✅ Batch started: ${JSON.stringify(data, null, 2)}`);
                    document.getElementById('batchStatus').innerHTML = `<div class="status success">✅ Batch started! Check Supabase logs for progress.</div>`;
                } else {
                    log(`❌ Failed to start batch: ${JSON.stringify(data)}`);
                    document.getElementById('batchStatus').innerHTML = `<div class="status error">❌ Failed: ${data.error}</div>`;
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`);
                document.getElementById('batchStatus').innerHTML = `<div class="status error">❌ Error: ${error.message}</div>`;
            }
        };

        window.checkStatus = async function() {
            if (!accessToken) {
                alert('Please login first!');
                return;
            }

            log('Checking batch status...');
            
            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/make-server-3bba8be8/batch-scraping/status`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    }
                });

                const data = await response.json();
                
                if (response.ok) {
                    log(`✅ Status: ${JSON.stringify(data, null, 2)}`);
                    document.getElementById('batchStatus').innerHTML = `<div class="status info"><pre>${JSON.stringify(data.batch, null, 2)}</pre></div>`;
                } else {
                    log(`❌ Failed to get status: ${JSON.stringify(data)}`);
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`);
            }
        };

        window.resetBatch = async function() {
            if (!accessToken) {
                alert('Please login first!');
                return;
            }

            if (!confirm('Are you sure you want to reset the batch?')) {
                return;
            }

            log('Resetting batch...');
            
            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/make-server-3bba8be8/batch-scraping/reset`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                
                if (response.ok) {
                    log(`✅ Batch reset: ${JSON.stringify(data, null, 2)}`);
                    document.getElementById('batchStatus').innerHTML = '<div class="status success">✅ Batch reset successfully!</div>';
                } else {
                    log(`❌ Failed to reset: ${JSON.stringify(data)}`);
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`);
            }
        };

        log('🚀 Test tool ready. Please login to continue.');
    </script>
</body>
</html>
